<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BD Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- Login -->
      <section id="view-login" class="view">
        <div class="brand">
          <img src="icons/icon48.png" alt="" class="logo" />
          <div>
            <h1>BD Tracker</h1>
            <p>Update tasks without leaving this tab</p>
          </div>
        </div>
        <label class="field">
          <span>Username</span>
          <input id="login-user" placeholder="saad or umair" autocomplete="username" />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="login-pass" type="password" placeholder="••••" autocomplete="current-password" />
        </label>
        <p id="login-error" class="error hidden"></p>
        <button id="btn-login" class="btn primary">Sign in</button>
      </section>

      <!-- Main workflow -->
      <section id="view-main" class="view hidden">
        <header class="top">
          <div class="brand compact">
            <img src="icons/icon48.png" alt="" class="logo sm" />
            <div>
              <strong id="user-label">User</strong>
              <span id="day-status" class="pill">—</span>
            </div>
          </div>
          <button id="btn-logout" class="btn ghost sm" title="Log out">⎋</button>
        </header>

        <div class="session-row">
          <button id="btn-start-day" class="btn accent sm">Start Day</button>
          <button id="btn-finish-day" class="btn outline sm hidden">Finish Day</button>
          <button id="btn-open-dash" class="btn ghost sm">Open Dashboard</button>
        </div>

        <nav id="step-tabs" class="steps"></nav>

        <div class="step-head">
          <div>
            <h2 id="step-title">Fiverr</h2>
            <p id="step-meta" class="muted"></p>
          </div>
          <div class="step-nav">
            <button id="btn-prev" class="btn outline sm">← Prev</button>
            <button id="btn-next" class="btn primary sm">Next →</button>
          </div>
        </div>

        <div id="counters" class="block"></div>
        <div id="checklist" class="block"></div>

        <label class="field">
          <span>Notes</span>
          <textarea id="notes" rows="2" placeholder="Quick note…"></textarea>
        </label>

        <footer class="foot">
          <span id="progress-label" class="muted">0%</span>
          <div class="bar"><div id="progress-bar"></div></div>
        </footer>
      </section>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
